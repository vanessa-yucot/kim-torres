<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - JM's Dressed Chicken</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="Images/WebLogo.png" alt="JM's Dressed Chicken Logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Products</a></li> 
                <li><a href="contact.html">Contacts</a></li>
                <li><a href="signup.html">Sign Up</a></li> 
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-form">
            <h1>Contact Us</h1>
            <p>SEND US AN EMAIL AND WE WILL GET BACK TO YOU AS SOON AS POSSIBLE.</p>
            
            <div class="contact-details">
                <div class="address">
                    <h2>Address</h2>
                    <p>JM's Dressed Chicken</p>
                    <p>Wet Market, Poblacion</p>
                    <p>Talibon, Bohol 6325</p>
                    <p>Cell: # 09091517663</p>
                </div>

            <div class="form-container">
                <h2>Ask a Question</h2>
                <form>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="question">Your Question:</label>
                    <textarea id="question" name="question" required></textarea>

                    <button type="submit">SEND</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 JM's Dressed Chicken | All rights reserved</p>
    </footer>
</body>
</html>
