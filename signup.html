<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JM's Dressed Chicken</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="Images/WebLogo.png" alt="JM's Dressed Chicken Logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li> 
                <li><a href="shop.html">Products</a></li>
                <li><a href="contact.html">Contacts</a></li> 
                <li><a href="signup.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="signup-section">
            <h1>Sign Up</h1>
            <form action="#" method="post">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <label for="password">Confirm password:</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Sign Up</button>
            </form>
            <p>Already have an account? <a href="login.html">Log In</a></p>
            <p class="terms">By clicking "Sign Up" I accept the Terms of Service, the Anti-Spam Policy, the Privacy Policy, and Accessibility Info.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 JM's Dressed Chicken | All rights reserved</p>
    </footer>
</body>
</html>
